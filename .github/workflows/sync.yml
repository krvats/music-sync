name: Music Sync

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:          # manual trigger from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write         # needed to commit sync_state.json

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run sync
        env:
          SPOTIFY_CLIENT_ID:     ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          YTMUSIC_OAUTH_JSON:    ${{ secrets.YTMUSIC_OAUTH_JSON }}
        run: python sync.py

      - name: Commit updated state
        run: |
          git config user.name  "music-sync-bot"
          git config user.email "bot@users.noreply.github.com"
          git add sync_state.json
          git diff --cached --quiet || git commit -m "chore: update sync state [skip ci]"
          git push
